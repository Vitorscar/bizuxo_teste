<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Demandas Disponíveis · Bizuxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap { padding: 24px 22px 80px; }
  .intro { margin-bottom: 20px; }
  .intro h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .intro p { font-size: 0.85rem; color: var(--ink-soft); margin: 0; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 8px 14px; font-size: 0.82rem; font-weight: 600;
    color: var(--ink-soft); background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 100px; cursor: pointer; transition: all 0.2s;
  }
  .filter-chip:hover { border-color: var(--alert); color: var(--ink); }
  .filter-chip.active { background: var(--alert); color: #fff; border-color: var(--alert); }

  .demand-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
  }
  .demand-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); transform: translateY(-1px); }
  .demand-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .demand-card-title { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; color: var(--ink); margin: 0; flex: 1; }
  .demand-card-badge {
    font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 100px;
    background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; margin-left: 8px;
  }
  .demand-card-badge.freelance { background: #EDE9FE; color: #5B21B6; }
  .demand-card-desc { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .demand-card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .demand-card-meta { display: flex; gap: 12px; font-size: 0.78rem; color: var(--ink-faint); }
  .demand-card-budget { font-family: var(--font-display); font-weight: 700; font-size: 0.9rem; color: var(--accent-ink); }

  .demand-card-images { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .demand-card-images img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h3 { font-size: 1.1rem; color: var(--ink); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="container-mobile">
  <header class="header-dark">
    <div class="header-top">
      <a class="pill-link" href="dashboard-prestador.html">← Voltar</a>
      <div class="brand alert">Bizu<span>xo</span></div>
      <div style="width:60px;"></div>
    </div>
    <h2 style="font-size:1.1rem; margin:0;">Demandas Disponíveis</h2>
  </header>

  <div class="wrap">
    <div class="intro">
      <p>Encontre oportunidades na sua região e envie propostas.</p>
    </div>

    <div class="filter-bar" id="filterBar">
      <span class="filter-chip active" onclick="filtrarPorCategoria('TODAS', this)">Todas</span>
      <!-- Categorias carregadas via JS -->
    </div>

    <div id="demandasList">
      <div class="empty-state"><h3>Carregando demandas...</h3></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>

<script>
  let providerProfileId = null;
  let providerCategories = [];
  let allDemands = [];
  let currentFilter = 'TODAS';

  async function init() {
    if (!window.supabaseClient) { alert('Erro de configuração.'); return; }

    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) { window.location.href = '../index.html'; return; }

    // 1. Buscar perfil do prestador
    const { data: profile } = await window.supabaseClient
      .from('profiles').select('id').eq('user_id', session.user.id).single();
    
    if (!profile) { alert('Perfil não encontrado.'); return; }
    providerProfileId = profile.id;

    // 2. Buscar categorias do prestador
    const { data: cats } = await window.supabaseClient
      .from('provider_categories').select('category_id, categories(name, icon)')
      .eq('provider_id', providerProfileId);
    
    if (cats && cats.length > 0) {
      providerCategories = cats.map(c => c.category_id);
      renderizarFiltros(cats);
    }

    // 3. Carregar demandas
    carregarDemandas();
  }

  function renderizarFiltros(cats) {
    const bar = document.getElementById('filterBar');
    cats.forEach(c => {
      if (c.categories) {
        const chip = document.createElement('span');
        chip.className = 'filter-chip';
        chip.textContent = `${c.categories.icon || '📌'} ${c.categories.name}`;
        chip.onclick = () => filtrarPorCategoria(c.category_id, chip);
        bar.appendChild(chip);
      }
    });
  }

  function filtrarPorCategoria(catId, element) {
    currentFilter = catId;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    renderizarDemandas();
  }

  async function carregarDemandas() {
    const { data, error } = await window.supabaseClient
      .from('demands')
      .select(`
        id, title, description, budget_min, budget_max, status, created_at,
        city, neighborhood, zip_code, media_urls,
        category_id, categories(name, icon, service_type)
      `)
      .eq('status', 'OPEN')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Erro ao buscar demandas:', error);
      document.getElementById('demandasList').innerHTML = '<div class="empty-state"><h3>Erro ao carregar demandas</h3></div>';
      return;
    }

    allDemands = data || [];
    renderizarDemandas();
  }

  function renderizarDemandas() {
    const container = document.getElementById('demandasList');
    
    let filtered = allDemands;
    if (currentFilter !== 'TODAS') {
      filtered = allDemands.filter(d => d.category_id === currentFilter);
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state"><h3>Nenhuma demanda encontrada</h3><p>Novas demandas aparecerão aqui quando clientes publicarem.</p></div>';
      return;
    }

    container.innerHTML = filtered.map(d => {
      const isFreelance = d.categories?.service_type === 'FREELANCE';
      const badgeClass = isFreelance ? 'demand-card-badge freelance' : 'demand-card-badge';
      const badgeText = isFreelance ? '💻 Online' : '🔧 Presencial';
      const budget = d.budget_max ? `R$ ${parseFloat(d.budget_max).toFixed(2)}` : (d.budget_min ? `A partir de R$ ${parseFloat(d.budget_min).toFixed(2)}` : 'A combinar');
      const date = new Date(d.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
      const location = d.city ? `📍 ${d.city}${d.neighborhood ? ' - ' + d.neighborhood : ''}` : '📍 Online';
      
      let imagesHtml = '';
      if (d.media_urls && d.media_urls.length > 0) {
        imagesHtml = `<div class="demand-card-images">${d.media_urls.slice(0, 4).map(url => `<img src="${url}" alt="Foto">`).join('')}</div>`;
      }

      return `
        <a href="enviar-proposta.html?demand_id=${d.id}" class="demand-card" style="text-decoration:none; color:inherit; display:block;">
          <div class="demand-card-header">
            <h3 class="demand-card-title">${d.title}</h3>
            <span class="${badgeClass}">${badgeText}</span>
          </div>
          ${imagesHtml}
          <p class="demand-card-desc">${d.description}</p>
          <div class="demand-card-footer">
            <div class="demand-card-meta">
              <span>${d.categories?.icon || '📌'} ${d.categories?.name || 'Serviço'}</span>
              <span>${location}</span>
              <span>📅 ${date}</span>
            </div>
            <span class="demand-card-budget">${budget}</span>
          </div>
        </a>
      `;
    }).join('');
  }

  init();
</script>
</body>
</html>
