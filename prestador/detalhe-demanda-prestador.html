<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar proposta · Bizuxo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .wrap{ padding:24px 22px 60px; }
  .success-state{ text-align:center; padding:20px 4px 4px; display:none; }
  .success-state.show{ display:block; }
  .check-circle{ width:56px; height:56px; border-radius:50%; background:var(--accent-soft); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .check-circle svg{ width:26px; height:26px; }
  .check-circle path{ stroke:var(--accent-ink); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .success-state h3{ font-size:1.1rem; margin:0 0 6px; }
  .success-state p{ font-size:0.85rem; color:var(--ink-soft); margin:0 0 20px; }
</style>
</head>
<body>

<div class="container-mobile">
  <header class="header-dark">
    <div class="header-top">
      <div class="brand alert">Bizu<span>xo</span></div>
      <a class="pill-link" href="demandas-disponiveis.html">← Voltar</a>
    </div>
    <h2 id="demandTitle" style="font-size:1.1rem; margin:0;">Carregando demanda...</h2>
  </header>

  <div class="wrap">
    <div class="card" id="detailCard">
      <div class="card-label alert"><span class="dot"></span>Detalhes da demanda</div>
      <div class="detail-lines" id="detailLines">
        <!-- Preenchido via JS -->
      </div>
      <p id="demandDesc" style="font-size:0.85rem; color:var(--ink-soft); line-height:1.5; margin:16px 0 0;"></p>
    </div>

    <form id="propostaForm">
      <div class="card">
        <div class="card-label alert"><span class="dot"></span>Sua proposta</div>
        <div class="field-row">
          <div class="field">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" placeholder="120" min="1" step="0.01" required>
          </div>
          <div class="field">
            <label for="prazo">Prazo</label>
            <select id="prazo" required>
              <option value="">Selecione...</option>
              <option value="hoje">Ainda hoje</option>
              <option value="1h">1 hora</option>
              <option value="2h">2 horas</option>
              <option value="amanha">Amanhã</option>
              <option value="semana">Essa semana</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="mensagem">Mensagem para o cliente</label>
          <textarea id="mensagem" placeholder="Ex: Consigo ir aí amanhã às 14h, já levo o material necessário..." required></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-alert" id="sendBtn">Enviar proposta</button>
    </form>

    <div class="success-state" id="successState">
      <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
      <h3>Proposta enviada!</h3>
      <p>O cliente vai receber sua proposta e pode entrar em contato a qualquer momento.</p>
      <a class="btn btn-dark" href="minhas-propostas.html">Ver minhas propostas</a>
    </div>
  </div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-cliente.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/cadastro.js"></script>
<script src="../js/auth.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const demandId = urlParams.get('id');

  async function init() {
    if (!demandId) { window.location.href = 'demandas-disponiveis.html'; return; }

    const { data, error } = await supabase
      .from('demands')
      .select(`*, service_types(nome), proposals(count)`)
      .eq('id', demandId)
      .single();

    if (error || !data) {
      alert('Demanda não encontrada');
      window.location.href = 'demandas-disponiveis.html';
      return;
    }

    document.getElementById('demandTitle').textContent = data.titulo;
    document.getElementById('demandDesc').textContent = `"${data.descricao}"`;
    
    const propostas = data.proposals[0]?.count || 0;
    const dataPub = new Date(data.created_at).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    
    document.getElementById('detailLines').innerHTML = `
      <div class="detail-line"><span>Categoria</span><span>${data.service_types?.nome || 'N/A'}</span></div>
      <div class="detail-line"><span>Local</span><span>${data.bairro}, ${data.cidade}</span></div>
      <div class="detail-line"><span>Publicada</span><span>${dataPub}</span></div>
      <div class="detail-line"><span>Propostas até agora</span><span>${propostas}</span></div>
    `;
  }

  document.getElementById('propostaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const session = await supabase.auth.getSession();
    if (!session.data.session) { alert('Faça login primeiro'); return; }

    const btn = document.getElementById('sendBtn');
    btn.textContent = 'Enviando...';
    btn.disabled = true;

    const { error } = await supabase.from('proposals').insert({
      demand_id: parseInt(demandId),
      provider_id: session.data.session.user.id,
      valor: parseFloat(document.getElementById('valor').value),
      prazo: document.getElementById('prazo').value,
      mensagem: document.getElementById('mensagem').value,
      status: 'pendente'
    });

    if (error) {
      alert('Erro ao enviar: ' + error.message);
      btn.textContent = 'Enviar proposta';
      btn.disabled = false;
    } else {
      // Atualiza status da demanda para garantir que apareça como "em propostas"
      await supabase.from('demands').update({ status: 'em_propostas' }).eq('id', demandId);
      
      document.getElementById('detailCard').style.display = 'none';
      document.getElementById('propostaForm').style.display = 'none';
      document.getElementById('successState').classList.add('show');
    }
  });

  init();
</script>
<script src="../js/mobile-nav.js"></script>
</body>
</html>
